# readthedocs' build of ALIS's documentation (Documentation Stage 1, DQ.6, DQ.8).
# The project is ALIS-fitting (https://alis-fitting.readthedocs.io). The site is
# HTML alone: no PDF or ePub (DQ.3). A warning fails the build, as in CI.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"

sphinx:
  configuration: doc/source/conf.py
  fail_on_warning: true

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs
