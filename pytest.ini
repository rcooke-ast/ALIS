[pytest]
# Configuration for the ALIS Stage 0 regression harness.
# Generated by RJC and Claude.
testpaths = tests
addopts = --strict-markers
markers =
    unit: fast, isolated unit test of a single function (no fits/subprocess/golden files; runs on every push)
    fast: every-commit batch (< 1 min/test, plus all fixed-parameter evals except the ~4 min DH_orders eval)
    medium: nightly batch (< 10 min/test; single-object real-world minimisations and the DH_orders fixed-param eval)
    slow: on-demand batch (>= 10 min/test; e.g. DH/J0814p5029, ~16 min)
    examples: case lives under examples/ (shipped example fits; the CI batch)
    context: case lives under context/fitting_examples/ (refactor-only reference fits; not run in CI)
